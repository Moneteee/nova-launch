<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GIRLSING · Shop</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/collection.css">
</head>
<body>
<header>
  <div class="container">
    <div class="navbar">
      <div class="logo">GIRLSING</div>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="collection.html" class="active-link">Shop</a></li>
        <li><a href="wishlist.html">Wishlist</a></li>
        <li><a href="member.html">Member</a></li>
        <li class="cart-wrapper"><button class="cart-btn" id="openCartBtn">🛒</button><span class="cart-count" id="cartCountBadge">0</span></li>
      </ul>
    </div>
  </div>
</header>

<main class="container">
  <div class="filter-bar">
    <div class="category-tabs" id="categoryTabs">
      <button class="cat-btn active-cat" data-cat="All">All</button>
      <button class="cat-btn" data-cat="Tops">Tops</button>
      <button class="cat-btn" data-cat="Hoodies">Hoodies</button>
      <button class="cat-btn" data-cat="Skirts">Skirts</button>
      <button class="cat-btn" data-cat="Dresses">Dresses</button>
      <button class="cat-btn" data-cat="Accessories">Accessories</button>
      <button class="cat-btn" data-cat="Footwear">Footwear</button>
    </div>
    <select id="sortSelect" class="sort-select">
      <option value="default">Recommended</option>
      <option value="price-asc">Price ↑ Low to High</option>
      <option value="price-desc">Price ↓ High to Low</option>
      <option value="new">Newest ↑ Arrivals</option>
    </select>
  </div>
  <div class="products-grid" id="collectionGrid"></div>
</main>

<footer>
  <div class="footer-grid">
    <div class="footer-col"><h4>GIRLSING</h4><a href="index.html">Home</a><a href="collection.html">Shop</a><a href="wishlist.html">Wishlist</a><a href="member.html">Member</a></div>
    <div class="footer-col"><h4>Support</h4><a class="footer-link" data-type="help">Help Center</a><a class="footer-link" data-type="return">Return Policy</a><a class="footer-link" data-type="track">Track Order</a></div>
    <div class="footer-col"><h4>Legal</h4><a class="footer-link" data-type="privacy">Privacy Policy</a><a class="footer-link" data-type="terms">Terms of Use</a></div>
    <div class="footer-col"><h4>Payment</h4><div>WeChat Pay / Alipay / Bank Card</div></div>
  </div>
  <div class="footer-bottom">© 2025-2026 GIRLSING</div>
</footer>

<script src="js/main.js"></script>
<script src="js/collection.js"></script>
</body>
</html>
